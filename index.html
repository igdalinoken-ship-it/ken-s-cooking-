<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ken's Cooking</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap');

        :root {
            --khaki: #C4A96A;
            --khaki-dark: #A08840;
            --khaki-light: #D4C49A;
            --dirty-white: #F5F0E8;
            --dirty-white-dark: #EAE2D4;
            --brown: #5C4A2A;
            --brown-light: #7A6540;
            --cream: #FBF8F2;
            --text-dark: #3D3020;
            --text-medium: #6B5D4A;
            --text-light: #8C7E6A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--dirty-white);
            color: var(--text-dark);
            line-height: 1.6;
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
        }

        /* ========== NAVBAR ========== */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(245, 240, 232, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--khaki);
            transition: box-shadow 0.3s ease;
        }

        nav.scrolled {
            box-shadow: 0 4px 20px rgba(92, 74, 42, 0.15);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 75px;
        }
